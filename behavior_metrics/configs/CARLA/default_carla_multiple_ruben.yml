#        MaxWaits: [450, 450, 450, 450] # maximum number of times the experiment status will be checked (MaxWaits * Timeout = max total time)
        Repetitions: 1
        clientPort: 2000
    Simulation:
        World: [
      #       configs/CARLA/CARLA_launch_files/town_01_clockwise.launch,
      #       configs/CARLA/CARLA_launch_files/town_03_clockwise_ruben.launch,
             configs/CARLA/CARLA_launch_files/town_04_ruben.launch,
      #       configs/CARLA/CARLA_launch_files/town_02_clockwise.launch,
      #       configs/CARLA/CARLA_launch_files/town_06_clockwise_ruben.launch,
      #       configs/CARLA/CARLA_launch_files/town_10_clockwise_ruben.launch,
            ]
        RandomSpawnPoint: False
        SpawnPoints: []
    Dataset:
        In: '/tmp/my_bag.bag'
        Out: ''
    Stats:
        Out: './'
        PerfectLap: './perfect_bags/lap-simple-circuit.bag'
    Layout:
        Frame_0:
            Name: frame_0
            Geometry: [1, 1, 1, 1]
            Data: rgbimage
        Frame_1:
            Name: frame_1
            Geometry: [0, 1, 1, 1]
            Data: rgbimage
        Frame_2:
            Name: frame_2
            Geometry: [0, 2, 1, 1]
            Data: rgbimage
        Frame_3:
            Name: frame_3
            Geometry: [1, 2, 1, 1]
            Data: rgbimage
